<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>His Grace Drugshop - Pharmacy Management System</title>
  
  <!-- Preload fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      background: linear-gradient(135deg, #2ECC71 0%, #1E8449 100%);
      min-height: 100vh;
    }
    
    #loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
    }
    
    .loader-container {
      text-align: center;
      animation: fadeIn 0.5s ease-in;
    }
    
    .loader {
      width: 60px;
      height: 60px;
      margin: 20px auto;
      border: 4px solid rgba(255,255,255,0.3);
      border-top: 4px solid #ffffff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    .logo-container {
      width: 120px;
      height: 120px;
      margin: 0 auto 20px;
      background: white;
      border-radius: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      overflow: hidden;
      animation: bounce 1s ease-in-out infinite;
    }
    
    .logo-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .logo-placeholder {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #2ECC71 0%, #27AE60 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    
    .app-title {
      font-size: 28px;
      font-weight: bold;
      margin-top: 20px;
      letter-spacing: 1px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }
    
    .app-subtitle {
      font-size: 14px;
      opacity: 0.9;
      margin-top: 8px;
    }
    
    .version {
      font-size: 12px;
      opacity: 0.7;
      margin-top: 30px;
    }
    
    .notification-prompt {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: white;
      color: #2C3E50;
      padding: 12px 24px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      z-index: 1000;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .notification-prompt:hover {
      transform: translateX(-50%) scale(1.05);
      background: #f0f0f0;
    }
    
    .notification-prompt.hidden {
      display: none;
    }
    
    .notification-icon {
      font-size: 20px;
    }
    
    @media (max-width: 768px) {
      .app-title {
        font-size: 22px;
      }
      .logo-container {
        width: 80px;
        height: 80px;
      }
      .loader {
        width: 40px;
        height: 40px;
      }
      .notification-prompt {
        font-size: 12px;
        padding: 10px 20px;
      }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="loader-container">
      <!-- Logo Container -->
      <div class="logo-container">
        <img id="logoImage" class="logo-img" src="assets/images/logo.jpg" alt="His Grace Drugshop Logo" 
             onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\'logo-placeholder\'>💊</div>';">
      </div>
      <div class="loader"></div>
      <div class="app-title">His Grace Drugshop</div>
      <div class="app-subtitle">Advanced Pharmacy Management</div>
      <div class="version">Version 1.0.0</div>
    </div>
  </div>
  
  <!-- Notification permission prompt (will be shown by JavaScript) -->
  <div id="notificationPrompt" class="notification-prompt hidden">
    <span class="notification-icon">🔔</span>
    <span>Enable notifications for important updates</span>
    <span style="font-size: 16px;">→</span>
  </div>
  
  <script>
    // Handle notification permissions
    function requestNotificationPermission() {
      if ('Notification' in window) {
        Notification.requestPermission().then(function(permission) {
          if (permission === 'granted') {
            console.log('Notification permission granted');
            // Hide the prompt
            document.getElementById('notificationPrompt').classList.add('hidden');
            // Show a welcome notification
            new Notification('Welcome to His Grace Drugshop!', {
              body: 'Notifications enabled. You will receive important updates about your pharmacy.',
              icon: '/icons/Icon-192.png'
            });
          } else {
            console.log('Notification permission denied');
          }
        });
      }
    }
    
    // Check if notifications are supported and not already granted
    if ('Notification' in window) {
      if (Notification.permission === 'default') {
        // Show the notification prompt after 2 seconds
        setTimeout(function() {
          const prompt = document.getElementById('notificationPrompt');
          prompt.classList.remove('hidden');
          prompt.addEventListener('click', requestNotificationPermission);
        }, 2000);
      } else if (Notification.permission === 'granted') {
        console.log('Notifications already granted');
      }
    }
    
    // Hide loading screen when Flutter is ready
    window.addEventListener('load', function() {
      // The loading div will be hidden by Flutter when the app is ready
      // But we'll set a timeout just in case
      setTimeout(function() {
        const loadingDiv = document.getElementById('loading');
        if (loadingDiv && loadingDiv.style.display !== 'none') {
          loadingDiv.style.opacity = '0';
          setTimeout(function() {
            loadingDiv.style.display = 'none';
          }, 500);
        }
      }, 5000);
    });
    
    // Preload the logo image to avoid flickering
    const logoImg = new Image();
    logoImg.src = 'assets/images/logo.jpg';
  </script>
  
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
