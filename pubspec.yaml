name: his_grace_drugshop
description: His Grace Drugshop Management System - Complete pharmacy management solution with prescriptions, credits, expenses, and inventory management
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # UI Components
  cupertino_icons: ^1.0.6
  google_fonts: ^8.0.2
  flutter_svg: ^2.0.9
  animations: ^2.0.8
  shimmer: ^3.0.0
  cached_network_image: ^3.3.0
  
  # State Management
  provider: ^6.1.1
  
  # Networking
  dio: ^5.4.0
  pretty_dio_logger: ^1.3.1
  retrofit: ^4.0.3
  json_annotation: ^4.8.1
  
  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^10.0.0
  sqflite: ^2.3.0
  path: ^1.9.0
  
  # Image Picker & Camera
  image_picker: ^1.0.5
  file_picker: ^10.3.10
  
  # Date/Time
  intl: ^0.20.2
  table_calendar: ^3.0.9
  
  # Charts & Data Visualization
  fl_chart: ^1.2.0
  
  # QR & Barcode
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0
  barcode: ^2.2.7
  
  # PDF & Printing
  pdf: ^3.12.0
  printing: ^5.14.3
  open_file: ^3.3.2
  
  # Excel Export
  excel: ^4.0.6
  
  # Utilities
  path_provider: ^2.1.1
  url_launcher: ^6.2.2
  connectivity_plus: ^7.0.0
  device_info_plus: ^12.3.0
  package_info_plus: ^9.0.0
  permission_handler: ^12.0.1
  share_plus: ^12.0.1
  
  # Notifications
  flutter_local_notifications: ^20.1.0
  
  # Forms & Validation
  flutter_form_builder: ^10.2.0
  form_builder_validators: ^11.2.0
  
  # Search & Filter
  flutter_typeahead: ^5.2.0
  
  # PDF Viewer
  flutter_pdfview: ^1.3.2
  
  # Animations
  lottie: ^3.3.0
  
  # UI Helpers
  flutter_slidable: ^4.0.3
  pull_to_refresh: ^2.0.0
  
  # Charts
  pie_chart: ^5.4.0
  
  # Authentication
  local_auth: ^3.0.1
  
  # Onboarding
  smooth_page_indicator: ^2.0.1
  
  # Badges
  badges: ^3.1.2
  
  # Image Processing
  image: ^4.3.0
  
  # File Handling
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.13.1
  json_serializable: ^6.13.1
  
flutter:
  uses-material-design: true
  
  assets:
    # Only include assets that actually exist
    - assets/images/logo.jpg
    - assets/images/placeholder.png
    # Add more assets as you create them
    # - assets/images/logo.png
    # - assets/images/no_image.png
    